[project]
name = "novo"
version = "0.2.2"
description = "A terminal tool for managing experimental Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fernando Meira", email = "fmeira.filho@gmail.com" },
]
keywords = ["cli", "tui", "experiments", "scaffolding", "uv", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15",
    "textual>=1.0",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/fmeiraf/novo"
Repository = "https://github.com/fmeiraf/novo"
Issues = "https://github.com/fmeiraf/novo/issues"
Changelog = "https://github.com/fmeiraf/novo/blob/main/CHANGELOG.md"

[project.scripts]
novo = "novo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novo", "src/seeds"]

[tool.hatch.build.targets.sdist]
include = [
    "src/novo",
    "src/seeds",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "textual-dev>=1.0"]
